# The per-commit userflow run: `mvn verify` at the pushed commit — which regenerates
# service/target/userstories/ through TokenValidationBootstrapIT — and the reports published as one
# docs bundle, site @userflows/qits-platform-maintenance, version = the bare commit sha, branch
# riding as artifacts metadata for discovery.
#
# NON-GATING BY DESIGN, which is why it is a separate file from ci-post-receive.yml: this run going
# red must not cost the branch its image while "quality gate before merging" is still a decision to
# be taken — when it is, these per-commit runs are what the gate reads. One run per push per
# branch, collapsed to the newest tip under burst. It selects every tracked branch, maintenance/*
# included: a bump branch is exactly a commit whose pins moved, and proving it is what this file is
# for. The release leg that only a maintenance/* branch gets stays in ci-post-receive.yml, where a
# push to one is already something this repository reacts to.
#
# THIS IS THE FIRST TIME THIS REPOSITORY'S SUITE RUNS IN CI AT ALL, and that is worth knowing before
# reading anything below. ci-post-receive.yml builds the image and nothing else: the Dockerfile's
# mvnw line carries `-DskipTests`, so until this file existed every test here had only ever run on a
# developer's machine. `verify` here is the WHOLE reactor — `maintenance` (the parsers, the pending
# rule, the store) and `service` (the API, the schedules, the packaged surface) — not the one IT.
#
# `user: build`, and it is zonky's reason. Both modules spawn a real PostgreSQL from a maven
# artifact — the clone-alone, docker-free rule is why the store is not a container — and initdb
# refuses to run as root and calls getpwuid, so the step needs a passwd-backed non-root user.
# maven-base carries one (adduser -D, uid 1001). The step containers are Alpine (musl), which is
# why BOTH poms that name zonky architectures carry embedded-postgres-binaries-linux-amd64-alpine as
# a fourth arch: a missing arch resolves green and then dies in the middle of a suite. A step
# container is started --cap-drop=ALL either way; /workspace is 1777 with a system-level
# safe.directory entry, so a non-root checkout is what the image was built to serve.
#
# NO DOCKER SOCKET IS WANTED. Nothing in this repository shells out to a daemon — this service
# decides what changes and a CI step applies it — and the store is a child process, not a container.
# `docker: true` would be a grant for nothing.
#
# Quinoa is off (`-Dquarkus.quinoa=false` — the extension's root toggle; `.enabled` is silently
# ignored and npm still runs): the client is ci-post-receive.yml's business, where the
# qits-platform-spa-maintenance submodule is initialised and its lockfile origins are swapped
# against the platform's npm registry, and none of that ritual belongs here — the stories assert
# nothing about the SPA. It is also what keeps this step from needing the submodule at all: the
# daemon's clone does not recurse, so service/src/main/webui arrives EMPTY, and an empty directory
# is the one case Quinoa treats as a misconfiguration rather than as "no client"
# (application.properties, the service pom and docker/Dockerfile's `test -f` guard all say the same
# thing from their own side). The packaged fast-jar failsafe boots is otherwise exactly what ships.
#
# THE TWO IT FLAGS ARE THE OTHER HALF, and they are why this repository does NOT opt its service
# module back into ITs the way qits-githost does. `skipITs` is true in the root pom and stays true;
# this module has two integration tests and only one of them belongs to this run:
#
#   TokenValidationBootstrapIT  the userflow — the whole point of this file
#   PackagedSurfaceIT           half about the CLIENT (the base href at the root, the deep links,
#                               the fallback that must not swallow /maintenance), which the line
#                               above deliberately does not build. A blanket `-DskipITs=false`
#                               would make this quinoa-less run red on a test that is right.
#
# Naming the class keeps the opt-in to this pipeline and to these stories, and keeps the property's
# own meaning ("run everything") intact for the `native` profile in service/pom.xml that sets it:
# `-DskipITs=false "-Dit.test=TokenValidationBootstrapIT"`.
#
# NO REPAIR WAS NEEDED to make the two new test-scope jars resolve. This repository already carries
# `.qits-maven-settings.xml` and a `qits-maven` <repositories> entry — qits-db-core, qits-auth-core
# and qits-arch-rules have always come from the platform registry — and docker/Dockerfile already
# builds with `--network host` and `-s .qits-maven-settings.xml`, so the image builds driven by
# ci-post-receive.yml and ci-event-release.yml resolve the new test classpath there the same way
# they already resolved those three. (`-DskipTests` skips test EXECUTION, not test COMPILATION, so
# the jars are fetched during an image build too; they are small, and qits-userflows' transitive
# Playwright is a jar, not a browser — nothing downloads Chromium unless a story asks for a Flow,
# and neither of these does.)
#
# Loop review: this pipeline PUTs a docs bundle and pushes no commit — no cycle, and in this
# repository that sentence is worth checking twice, because a maintenance BUMP is how commits get
# pushed elsewhere. Nothing here asks qits-ci for one: the launched process has every peer pointed
# at a dead loopback port by the IT's profile and the schedules are off, so the run reaches
# qits-projects, qits-githost, qits-ci, the registries and the mirror not at all. The bundle goes to
# qits-artifacts and is read back by qits-docs, neither of which is this service. There is nothing
# else to darken: this repository has no event bus client and no opentelemetry extension on its
# classpath, and the one dial-out a boot with the gate on makes is the JWKS fetch, which the IT
# points at its own MockIdp. Publish-if-absent: events redeliver and docs versions are immutable, so
# 409 is success (the qits-spa-ui-components release file's discipline).
event: SCMPublishCommit
when:
  - repoId: { exact: qits-platform-maintenance }
    suppressCi: { exact: "false" }
checkout:
  branch: branch
  sha: sha
steps:
  - image: qits/build-images/maven-base:latest
    user: build
    timeout-seconds: 2400
    script: |
      set -eu
      # The platform registry, exactly as qits-eventstream's step derives it: the pom's default
      # names a host-published address unreachable from a step container, and the exact-id mirror
      # in .qits-maven-settings.xml is what passes Maven's HTTP blocker.
      export QITS_MAVEN_REPOSITORY_URL="$QITS_MAVEN_REGISTRY_URL"
      # -Dquarkus.http.test-port=0 is AGENTS.md's gate command spelled out rather than assumed: both
      # modules' test application.properties already pin it and failsafe passes it to the launched
      # artifact, so this repeats what is configured rather than adding to it — and it is the one
      # flag whose absence turns "8081 is already bound" into something that reads like a code
      # failure.
      ./mvnw -B -ntp -s .qits-maven-settings.xml verify \
        -Dqits.maven.repository.url="$QITS_MAVEN_REPOSITORY_URL" \
        -Dquarkus.http.test-port=0 \
        -Dquarkus.quinoa=false \
        -DskipITs=false "-Dit.test=TokenValidationBootstrapIT"

      # `-C … .` so the story directories are the bundle's roots — nesting one directory deep would
      # put it in every served URL. The path is service/target/userstories because the stories live
      # in the one module that packages an artifact to boot; `maintenance/` is a library jar.
      tar -czf userstories.tgz -C service/target/userstories .

      # Branch and commit ride as metadata (the docs store's exact-match discovery keys); the
      # version is the sha itself, so a bundle URL never changes meaning.
      status=$(curl -sS -o /tmp/docs-publish.out -w '%{http_code}' \
        -X PUT --data-binary @userstories.tgz \
        -H "X-Artifacts-Meta-git.branch.name: $QITS_CI_BRANCH" \
        -H "X-Artifacts-Meta-git.commit.hash: $QITS_CI_SHA" \
        -H "X-Artifacts-Meta-git.repository.name: qits-platform-maintenance" \
        "$QITS_DOCS_URL/@userflows/qits-platform-maintenance/-/$QITS_CI_SHA")
      case "$status" in
        201) echo "published userflows for qits-platform-maintenance@$QITS_CI_SHA ($QITS_CI_BRANCH)" ;;
        409) echo "userflows for qits-platform-maintenance@$QITS_CI_SHA already published — skipping" ;;
        *)   echo "docs publish failed: HTTP $status"; cat /tmp/docs-publish.out; exit 1 ;;
      esac
