# The release pipeline: this repository reacts to its OWN release and pushes the image under the
# released VERSION. The two-half release pattern is copied across the platform's SPA-serving
# services and the copies should keep matching. The short form of the rules that bite:
#
# - The selection naming this repository is not a loop: SCMRelease comes from qits-projects' Auto
#   Release, and nothing in this file publishes it.
# - `artifacts:` is a declaration, not a report — qits-ci cannot see what the step pushed and
#   announces on the strength of it. One entry, because this pipeline pushes one image: the jars
#   this repo builds stay inside it and no maven release publishes them.
# - The name is unqualified on purpose; the reader supplies its own registry host.
# - The build below is ci-event-release-request.yml's gating step, and the two must stay matched:
#   the QA pipeline proves a release request's fold with this same build, minus the push. The
#   version tag this pushes is the only coordinate — the per-push sha image went with per-push CI,
#   and a Deployment Request names the version.
# - This file is inert until an SCMRelease for this repository exists, and it lands first on
#   purpose — the bus is at-most-once, so the trigger must precede the event it selects.
event: SCMRelease
when:
  - repository: { exact: qits-maintenance-platform-service }
artifacts:
  - { type: docker, name: qits/qits-platform-maintenance }
steps:
    # node-docker-base, the image ci-event-release-request.yml already uses: node, npm and git for the
    # bundle half, buildctl for the image half — and node is also what reads the event
    # payload, which is JSON. qits-platform-idp's 2026.814.191019 release burned on the old ci-base form of this
    # file: no node, no bundle, and the Dockerfile's guard stopped the version image cold.
    #
    # `build: true` REPLACED `docker: true` WHEN THE BUILD MOVED OFF THE HOST DAEMON. It is the
    # per-step, diff-visible declaration the platform keys everything on — the commissioned
    # credential, the auth document, and the platform builder's address, which qits-containers
    # injects as $BUILDKIT_HOST into exactly these steps — and unlike its predecessor it mounts no
    # docker socket, because nothing here uses one. qits-buildkit-plan.md is the whole migration.
  - image: qits/build-images/node-docker-base:latest
    build: true
    timeout-seconds: 3600
    script: |
      # Without -e a failed buildctl call is swallowed and a green release run makes qits-ci announce
      # an artifact that was never pushed. -u makes an unset injected variable stop the step.
      set -eu

      # The builder, demanded loudly before anything is built. Unset means a qits-ci/qits-containers
      # pair too old to inject the pair; EMPTY means the kill switch (qits.ci.buildkit.enabled=false
      # spells off as empty-never-absent). Either way this recipe must fail here, naming the cause,
      # rather than compose a reference out of empty strings — a silent fallback is exactly what the
      # migration exists to remove.
      : "${BUILDKIT_HOST:?the platform builder is off or not injected; this recipe builds only through it}"
      : "${QITS_BUILD_REGISTRY:?}"

      # The event, read as data: the payload reaches the container verbatim in $QITS_EVENT_PAYLOAD,
      # with no per-field projection.
      version=$(node -p 'JSON.parse(process.env.QITS_EVENT_PAYLOAD).version')
      # A version here is a calver or a semver, and nothing legitimate needs a character outside
      # this set. Refused rather than quoted, because it reaches a shell and a docker reference.
      case "$version" in
        ''|*[!0-9A-Za-z._+-]*) echo "refusing an implausible version: $version" >&2; exit 1 ;;
      esac
      echo "releasing qits/qits-platform-maintenance:$version"

      # The tag is the checkout target: an event-triggered run is cloned at the head of main, which
      # a later push moves — the tag does not. The clone is shallow and carries no tags, hence the
      # explicit refspec; the URL rather than `origin` because every address a step needs arrives
      # as environment. `checkout --detach` peels the tag — and it is what makes the submodule
      # fetch below land on the gitlink the release recorded rather than on main's.
      git fetch "$QITS_CI_REPOSITORY_URL" "refs/tags/$version:refs/tags/$version"
      git checkout --detach "$version"

      # --- half one: the bundle -----------------------------------------------------------------
      # The daemon's clone is shallow and does not recurse, so the qits-maintenance-platform-frontend submodule
      # arrives as an empty directory and the Dockerfile's guard fails the image build on it. See
      # ci-event-release-request.yml for why the lockfile origins are rewritten and why the registry is
      # passed as environment rather than as a file — the SPA's committed .npmrc outranks any
      # ~/.npmrc this step could write.
      frontend_url="${QITS_CI_REPOSITORY_URL%/*}/qits-maintenance-platform-frontend"
      git -c submodule.qits-maintenance-platform-frontend.url="$frontend_url" submodule update --init service/src/main/webui

      cd service/src/main/webui
      # Two registries since the byte-plane split, so the swap reads the PATH: an entry under the
      # hosted registry's own pathname ($QITS_NPM_REGISTRY_URL's, /artifacts/npm/npm/) gets the
      # hosted origin and everything else gets the proxy's, and the broad expression has to run
      # before the narrow one. ci-event-release-request.yml carries the full reasoning.
      npm_hosted_origin=$(node -p 'new URL(process.env.QITS_NPM_REGISTRY_URL).origin')
      npm_proxy_origin=$(node -p 'new URL(process.env.QITS_NPM_PROXY_URL).origin')
      npm_hosted_path=$(node -p 'new URL(process.env.QITS_NPM_REGISTRY_URL).pathname')
      sed -i -E \
        -e "s#(\"resolved\": \")https?://[^/\"]+#\1$npm_proxy_origin#" \
        -e "s#(\"resolved\": \")https?://[^/\"]+($npm_hosted_path)#\1$npm_hosted_origin\2#" \
        package-lock.json

      env npm_config_registry="$QITS_NPM_PROXY_URL" \
          "npm_config_@qits:registry=$QITS_NPM_REGISTRY_URL" \
          npm ci --no-audit --no-fund

      npm run build
      cd -

      # --- half two: the image ------------------------------------------------------------------
      # Same doctrine as ci-event-release-request.yml, which carries the full account: no
      # `--network host` and nothing replacing it, because every `RUN` executes in the platform
      # builder's own namespace on qits-net — so the platform Maven repository is dialled at
      # $QITS_MAVEN_REGISTRY_URL and Maven Central through $QITS_MAVEN_PROXY_URL, both IN-NETWORK
      # addresses, where this line used to spell the host-published `http://$QITS_REGISTRY/…` and the
      # edge vhost $QITS_MAVEN_CENTRAL_MIRROR_URL. Without the first the qits-db-core and
      # qits-arch-rules resolve dies inside the build; an empty second one deactivates the settings
      # profile and Central is resolved directly.
      #
      # And the same credential doctrine: a SECRET, never a build arg, because an arg is recorded in
      # the history of a pullable image — in FILE form on both sides, written under umask 077 into
      # /tmp (outside the clone, so it cannot enter the build context) and mounted by the Dockerfile
      # as a bare file under /run/secrets, never the `env=` mount form that couples this recipe to
      # the builder's frontend version. The launcher injects the run's commissioned client as
      # $QITS_COMMISSIONED_CLIENT_ID/$QITS_COMMISSIONED_CLIENT_SECRET; `:-` keeps the pair optional
      # exactly as `--secret …,env=` did, so a deployment with no idp client still builds green.
      # ci-event-release-request.yml writes the same two files; keep them matched.
      umask 077
      printf '%s' "${QITS_COMMISSIONED_CLIENT_ID:-}" > /tmp/qits-client-id
      printf '%s' "${QITS_COMMISSIONED_CLIENT_SECRET:-}" > /tmp/qits-client-secret

      # `push=true` IS THE PUBLISH: the image goes from the builder straight to the registry and
      # never enters any local image store — which is why there is no `docker push` line and no
      # `docker rmi` question left. The old note here about a concurrent-build rmi race described a
      # store this pipeline no longer touches. $QITS_BUILD_REGISTRY is the registry as the BUILDER
      # resolves it; $QITS_REGISTRY stays the host daemon's view and is not dialled here.
      ref="$QITS_BUILD_REGISTRY/$QITS_IMAGE_REPOSITORY/qits-platform-maintenance:$version"
      buildctl build --frontend dockerfile.v0 \
        --local context=. --local dockerfile=docker \
        --opt build-arg:QITS_MAVEN_REPOSITORY_URL="$QITS_MAVEN_REGISTRY_URL" \
        --opt build-arg:QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_PROXY_URL:-}" \
        --secret id=qits-client-id,src=/tmp/qits-client-id \
        --secret id=qits-client-secret,src=/tmp/qits-client-secret \
        --output "type=image,name=$ref,push=true"

      # --- the SBOM -----------------------------------------------------------------------------
      # THE DOCUMENT GOES UP AFTER THE PUSH AND BEFORE THIS STEP EXITS GREEN. qits-ci announces
      # `SoftwareRelease` only for a green run, so ordering is the whole guarantee: no consumer is
      # ever told about a version whose bill of materials is missing. A failed PUT fails the release
      # ON PURPOSE — the store being down is not a reason to announce a version nobody can audit.
      # Only THIS pipeline uploads one: the QA pipeline's fold build announces no release, so it
      # owes no document.
      #
      # The second `buildctl build` reaches the Dockerfile's `sbom` stage — a `FROM scratch` holding
      # only the service module's CycloneDX document, exported with `type=local` instead of pushed.
      # Args and secrets are BYTE-IDENTICAL to the image build above, which is what makes every
      # layer a cache hit in the same builder and this export seconds rather than a second native
      # compile; a drift between the two invocations costs a full rebuild, not a wrong document.
      buildctl build --frontend dockerfile.v0 \
        --local context=. --local dockerfile=docker \
        --opt target=sbom \
        --opt build-arg:QITS_MAVEN_REPOSITORY_URL="$QITS_MAVEN_REGISTRY_URL" \
        --opt build-arg:QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_PROXY_URL:-}" \
        --secret id=qits-client-id,src=/tmp/qits-client-id \
        --secret id=qits-client-secret,src=/tmp/qits-client-secret \
        --output type=local,dest=.sbom
      # The SBOM store is a sibling path of the npm registry inside the qits-artifacts deployment,
      # so its root is DERIVED from $QITS_NPM_REGISTRY_URL — the qits-net alias a STEP container can
      # reach. NOT from $QITS_REGISTRY: that is the host daemon's view of the registry, which this
      # step does not dial at all any more, and inside this container it answers curl with an
      # instant connection refusal (the edge 401s a sessionless write besides — measured twice on
      # 2026.902.53027). Not from $QITS_BUILD_REGISTRY either: that one is the BUILDER's view. The path names
      # the DECLARED artifact identity verbatim: `artifacts:` above says
      # `{type: docker, name: qits/qits-platform-maintenance}`, and (packageType, packageName,
      # version) is how the SoftwareRelease consumer will ask for it.
      sbom_base="${QITS_NPM_REGISTRY_URL%%/artifacts/*}/artifacts/sboms"
      curl -fsS -X PUT -H 'Content-Type: application/vnd.cyclonedx+json' \
        --data-binary @.sbom/sbom.json \
        "$sbom_base/docker/qits/qits-platform-maintenance/-/$version"
