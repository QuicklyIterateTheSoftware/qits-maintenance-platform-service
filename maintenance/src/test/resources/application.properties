# Test-only settings for the domain jar's own suite.
#
# This module is a LIBRARY, so it ships no application.properties of its own — what it ships are
# defaults at META-INF/microprofile-config.properties (ordinal 100). This file is the app-level
# config the suite runs as, and it exists because a @QuarkusTest needs an application even when the
# code under test is a jar.

quarkus.http.test-port=0
quarkus.devservices.enabled=false
quarkus.scheduler.enabled=false

# The suite shares one embedded postgres across classes; EmbeddedPgConfigSource supplies its
# coordinates at run time, and cleaning at start keeps a shared schema reproducible.
quarkus.flyway.maintenance.clean-at-start=true
